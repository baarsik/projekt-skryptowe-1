name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt ruff
      - name: Install SQL driver system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgssapi-krb5-2 libltdl7
      - name: Lint backend
        run: python -m ruff check .
      - name: Start disposable SQL Server
        run: python ../.github/scripts/start_test_database.py
      - name: Test backend
        run: python -m pytest -q
      - name: Stop disposable SQL Server
        if: always() && env.COMPOSE_PROJECT_NAME != ''
        working-directory: .
        run: docker compose down -v

  frontend:
    name: Frontend validation
    uses: ./.github/workflows/frontend-validation.yml
