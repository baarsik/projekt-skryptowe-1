name: Application CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Validate both applications in parallel on main and manual runs.
  frontend:
    name: Frontend validation
    uses: ./.github/workflows/frontend-validation.yml

  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Install SQL driver system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgssapi-krb5-2 libltdl7
      - name: Start disposable SQL Server
        run: python ../.github/scripts/start_test_database.py
      - name: Run backend tests
        run: .venv/bin/python -m pytest -q
      - name: Stop disposable SQL Server
        if: always() && env.COMPOSE_PROJECT_NAME != ''
        working-directory: .
        run: docker compose down -v
      - name: Prepare backend deployment ZIP
        run: >
          .venv/bin/python ../.github/scripts/package_backend.py
          --repository "$GITHUB_WORKSPACE"
          --revision "$GITHUB_SHA"
          --output "$RUNNER_TEMP/backend.zip"
      - name: Save validated backend
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-source
          path: ${{ runner.temp }}/backend.zip
          if-no-files-found: error
          retention-days: 7

  # Deploy the validated artifacts only on main, after BOTH validation jobs pass.
  deploy_frontend:
    name: Deploy frontend
    needs: [frontend, backend, database]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check deployment configuration
        env:
          DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$DEPLOYMENT_TOKEN" ]; then
            echo '::error::Manually add AZURE_STATIC_WEB_APPS_API_TOKEN to this repository before deploying.'
            exit 1
          fi
      - name: Download validated frontend
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-static
          path: frontend-static
      - name: Upload static files
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend-static
          output_location: ''
          api_location: ''
          skip_app_build: true
          skip_api_build: true
          is_static_export: true
          production_branch: main

  deploy_backend:
    name: Deploy backend
    needs: [frontend, backend, database]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download validated backend
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-source
          path: backend-artifact
      - name: Sign in to Azure using OIDC
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          # Public identifiers; the identity accepts only this repository's main ref.
          client-id: e5297642-2776-48d2-84e8-76d5b48e6c2a
          tenant-id: 2b21cb1e-3044-41f9-85d9-f592b1493d6f
          subscription-id: 8117cfd0-f60d-4827-95de-824dcf3e9959
      - name: Deploy backend source
        uses: Azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
        with:
          app-name: projekt-skryptowe-1-api-baarsik
          package: backend-artifact/backend.zip

  # Always gate main deployments on migrations from the validated backend artifact.
  database:
    name: Migrate Azure SQL
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ${{ vars.AZURE_SQL_MIGRATION_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      APP_ENV: azure
      DB_HOST: grandduchy-server.database.windows.net
      DB_NAME: rachunki-db
      DB_AUTHENTICATION: ActiveDirectoryDefault
      AZURE_TOKEN_CREDENTIALS: AzureCliCredential
    steps:
      - name: Check migration identity and network runner configuration
        env:
          MIGRATION_CLIENT_ID: ${{ vars.AZURE_SQL_MIGRATION_CLIENT_ID }}
          MIGRATION_RUNNER: ${{ vars.AZURE_SQL_MIGRATION_RUNNER }}
        run: |
          if [ -z "$MIGRATION_CLIENT_ID" ] || [ -z "$MIGRATION_RUNNER" ]; then
            echo '::error::Configure AZURE_SQL_MIGRATION_CLIENT_ID and AZURE_SQL_MIGRATION_RUNNER with SQL network access. See README.md.'
            exit 1
          fi
      - name: Download validated backend
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-source
          path: backend-artifact
      - name: Unpack validated backend
        run: |
          migration_directory="$RUNNER_TEMP/rachunki-migration-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "MIGRATION_DIRECTORY=$migration_directory" >> "$GITHUB_ENV"
          unzip -q backend-artifact/backend.zip -d "$migration_directory"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install validated dependency versions
        working-directory: ${{ env.MIGRATION_DIRECTORY }}
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Sign in with the separate SQL migration identity
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_SQL_MIGRATION_CLIENT_ID }}
          tenant-id: 2b21cb1e-3044-41f9-85d9-f592b1493d6f
          allow-no-subscriptions: true
      - name: Apply pending schema migrations
        working-directory: ${{ env.MIGRATION_DIRECTORY }}
        run: .venv/bin/python -m alembic upgrade head
      - name: Seed required reference data
        working-directory: ${{ env.MIGRATION_DIRECTORY }}
        run: .venv/bin/python -m db.seed --profile reference
